<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg-grad)"/>

  <!-- Subtle border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="95" ry="95" fill="none"
        stroke="rgba(255,255,255,0.07)" stroke-width="3"/>

  <!-- Lowercase "i" — dot (perfect circle at top) -->
  <circle cx="256" cy="148" r="28" fill="url(#mark-grad)"/>

  <!-- Lowercase "i" — stem (clean rounded rectangle) -->
  <rect x="232" y="200" width="48" height="164" rx="24" fill="url(#mark-grad)"/>
</svg>
